{{- if include "schematic-replicator.createSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "schematic-replicator.fullname" . }}
  labels:
    {{- include "schematic-replicator.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if and (not .Values.schematic.existingSecret) .Values.schematic.apiKey }}
  api-key: {{ .Values.schematic.apiKey | b64enc | quote }}
  {{- end }}
  {{- if and (not .Values.redis.existingSecret) .Values.redis.password }}
  redis-password: {{ .Values.redis.password | b64enc | quote }}
  {{- end }}
{{- end }}
