name: ci

on: [push]

jobs:
  compile:
    runs-on: runs-on=${{ github.run_id }}/runner=1cpu-linux-arm64
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Compile
        run: go build ./...

  test:
    runs-on: runs-on=${{ github.run_id }}/runner=1cpu-linux-arm64
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Test
        run: go test ./...

  chart:
    runs-on: runs-on=${{ github.run_id }}/runner=1cpu-linux-arm64
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      # Chart is verified against both Helm 3 and 4; pinned to 3 here since that
      # is what most consumers run.
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.21.3

      - name: Install kubeconform
        run: |
          curl -sSfL \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-arm64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform
          kubeconform -v
        env:
          KUBECONFORM_VERSION: '0.8.0'

      - name: Validate chart
        run: ./scripts/validate-chart.sh