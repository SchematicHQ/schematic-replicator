name: chart

# Runs when the chart itself changes, and when Go sources change: the chart
# mirrors the application's environment surface, so a new os.Getenv makes the
# chart drift. validate-chart.sh fails on drift in either direction.
#
# Documentation-only changes match none of these paths and do not trigger a run.
on:
  push:
    paths:
      - 'deployments/charts/**'
      - 'scripts/validate-chart.sh'
      - '.github/workflows/chart.yml'
      - '**.go'

jobs:
  validate:
    runs-on: runs-on=${{ github.run_id }}/runner=1cpu-linux-arm64
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      # Chart is verified against both Helm 3 and 4; pinned to 3 here since that
      # is what most consumers run.
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.21.3

      - name: Install kubeconform
        run: |
          curl -sSfL \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-arm64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform
          kubeconform -v
        env:
          KUBECONFORM_VERSION: '0.8.0'

      - name: Validate chart
        run: ./scripts/validate-chart.sh
