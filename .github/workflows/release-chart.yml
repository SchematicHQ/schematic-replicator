name: release-chart

# Publishes the Helm chart to ECR Public as an OCI artifact. Charts live under a
# charts/ prefix so they sit next to the image without sharing its tag list:
#
#   helm install replicator oci://public.ecr.aws/n5h3a7j9/charts/schematic-replicator --version X.Y.Z
#
# Released by pushing a chart-vX.Y.Z tag, separate from the image's vX.Y.Z tags,
# since the chart and the replicator are versioned independently. The tag must
# match `version` in Chart.yaml.
on:
  push:
    tags:
      - 'chart-v*.*.*'

env:
  CHART: deployments/charts/schematic-replicator
  ECR_REGISTRY: public.ecr.aws/n5h3a7j9
  ECR_CHART_PATH: charts

jobs:
  publish:
    runs-on: runs-on=${{ github.run_id }}/runner=1cpu-linux-arm64
    permissions:
      contents: read
      id-token: write # Required for OIDC

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.21.3

      - name: Check tag matches Chart.yaml version
        run: |
          tag_version="${GITHUB_REF_NAME#chart-v}"
          chart_version=$(helm show chart "$CHART" | awk '/^version:/ {print $2}')
          if [ "$tag_version" != "$chart_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Chart.yaml version $chart_version" >&2
            exit 1
          fi

      - name: Install kubeconform
        run: |
          curl -sSfL \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-arm64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform
        env:
          KUBECONFORM_VERSION: '0.8.0'

      - name: Validate chart
        run: ./scripts/validate-chart.sh

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.PROD_AWS_ROLE_ARN }}
          role-session-name: GitHubActions-ECR-Chart-Push
          aws-region: us-east-1 # ECR Public is only available in us-east-1

      - name: Log in to Amazon ECR Public
        run: |
          aws ecr-public get-login-password --region us-east-1 \
            | helm registry login --username AWS --password-stdin public.ecr.aws

      - name: Package and push chart
        run: |
          helm package "$CHART" --destination dist
          helm push dist/*.tgz "oci://${ECR_REGISTRY}/${ECR_CHART_PATH}"
